name: gohackme_workspace

packages:
  - app
  - packages/**
  - server

command:
  version:
    workspaceChangelog: true

scripts:
  analyze:
    run: melos exec -- dart analyze .
    description: Run dart analyze on all packages.

  test:
    run: melos exec -- dart test
    description: Run all tests in all packages.

  generate:
    run: melos exec -- dart run build_runner build --delete-conflicting-outputs
    description: Run code generation (Riverpod, Freezed) on all packages.

  clean:
    run: melos exec -- flutter clean
    description: Clean all packages.

  # ── Release builds ──────────────────────────────────────────────────────────

  build:apk:
    run: cd app && flutter build apk --release
    description: Build a universal release APK (Android).

  build:aab:
    run: cd app && flutter build appbundle --release
    description: Build a release Android App Bundle for Google Play.

  build:linux:
    run: cd app && flutter build linux --release
    description: Build the Linux desktop release bundle.

  build:appimage:
    run: ./scripts/build_appimage.sh --skip-build
    description: Package the already-built Linux bundle into an AppImage (run build:linux first).

  build:linux+appimage:
    run: |
      (cd app && flutter build linux --release)
      ./scripts/build_appimage.sh --skip-build
    description: Full Linux release → AppImage in one command.

