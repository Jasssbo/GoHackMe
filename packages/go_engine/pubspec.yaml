name: go_engine
description: >-
  Pure-Dart Go game engine shared between the Flutter app and the Dart server.
  Implements board logic, Go rules (capture, Ko, scoring), the subnet economy,
  and the attack mechanics for GoHackMe.
version: 0.4.3
publish_to: none
license: MIT

environment:
  sdk: ^3.5.0

dependencies:
  collection: ^1.18.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
