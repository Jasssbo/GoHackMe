name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # ─── Static analysis ──────────────────────────────────────────────────────
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: |
          (cd packages/go_engine && dart pub get)
          (cd server && dart pub get)
          (cd app && flutter pub get)

      - name: Analyze engine
        run: cd packages/go_engine && dart analyze --fatal-warnings

      - name: Analyze server
        run: cd server && dart analyze --fatal-warnings

      - name: Analyze app
        run: cd app && flutter analyze --fatal-warnings

  # ─── Tests ────────────────────────────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: |
          (cd packages/go_engine && dart pub get)
          (cd server && dart pub get)
          (cd app && flutter pub get)

      - name: Engine tests
        run: cd packages/go_engine && dart test

      - name: Server tests
        run: cd server && dart test

      - name: App widget tests
        run: cd app && flutter test

  # ─── Dependency vulnerability audit ───────────────────────────────────────
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OSV-Scanner v2.x changed from a composite action to a reusable workflow,
      # so `uses: google/osv-scanner-action@v2.x` fails with "runs: required".
      # We install the binary directly instead — same scan, no action fragility.
      - name: Install OSV-Scanner
        run: |
          curl -fsSL \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: OSV-Scanner
        # continue-on-error so an advisory never blocks the entire security
        # workflow — the report is still surfaced as a warning annotation.
        continue-on-error: true
        run: |
          osv-scanner \
            --lockfile=packages/go_engine/pubspec.lock \
            --lockfile=server/pubspec.lock \
            --lockfile=app/pubspec.lock

  # ─── Secret scanning ───────────────────────────────────────────────────────
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # On push: compare against the commit before this push.
          # On PR: compare against the PR base branch SHA.
          # This avoids the "BASE and HEAD commits are the same" error that
          # occurs when base is set to the branch name on a direct push.
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --only-verified
